<div class="wizard-container">
  <div class="panel-header">
    <h2>Asistente de Creación de Malla</h2>
    <p class="descripcion">Crea una malla curricular completa en pocos pasos. Si escribes el nombre de una asignatura que ya existe en el catálogo, se reutiliza automáticamente — no se duplica.</p>
  </div>

  <div class="pasos">
    <span class="paso-item" [class.activo]="paso === 1" [class.completado]="paso > 1">1. Datos de la malla</span>
    <span class="paso-item" [class.activo]="paso === 2" [class.completado]="paso > 2">2. Niveles</span>
    <span class="paso-item" [class.activo]="paso === 3">3. Asignaturas</span>
  </div>

  <!-- PASO 1 -->
  <div class="card" *ngIf="paso === 1">
    <div class="campo">
      <label>Carrera</label>
      <select [(ngModel)]="carreraId">
        <option value="">-- Selecciona --</option>
        <option *ngFor="let c of carreras" [value]="c.id">{{ c.nombre }}</option>
      </select>
    </div>
    <div class="campo">
      <label>Nombre de la malla</label>
      <input [(ngModel)]="nombreMalla" placeholder="Ej. Malla 2026">
    </div>
    <div class="campo">
      <label>Versión</label>
      <input [(ngModel)]="version" placeholder="Ej. 2026">
    </div>
    <div class="campo">
      <label>Vigencia desde</label>
      <input type="date" [(ngModel)]="fechaVigenciaInicio">
    </div>
    <button class="btn btn-siguiente" (click)="irAPaso2()">Siguiente →</button>
  </div>

  <!-- PASO 2 -->
  <div class="card" *ngIf="paso === 2">
    <div class="campo">
      <label>¿Cuántos niveles tiene esta carrera?</label>
      <input type="number" min="1" [(ngModel)]="cantidadNiveles">
    </div>
    <div class="botones-paso">
      <button class="btn btn-volver" (click)="volver()">← Atrás</button>
      <button class="btn btn-siguiente" (click)="irAPaso3()">Siguiente →</button>
    </div>
  </div>

  <!-- PASO 3 -->
  <div *ngIf="paso === 3">
    <div class="card" *ngFor="let nivel of niveles">
      <h3>Nivel {{ nivel.numero }}</h3>
      <div class="campo">
        <label>¿Cuántas asignaturas tiene este nivel?</label>
        <input type="number" min="0" [(ngModel)]="nivel.cantidadAsignaturas" (change)="actualizarCantidadAsignaturas(nivel)">
      </div>

      <div class="lista-asignaturas" *ngIf="nivel.nombresAsignaturas.length > 0">
        <div class="campo" *ngFor="let a of nivel.nombresAsignaturas; let i = index">
          <label>Asignatura {{ i + 1 }}</label>
          <input [(ngModel)]="nivel.nombresAsignaturas[i]" placeholder="Ej. Matemáticas">
        </div>
      </div>
    </div>

    <div class="botones-paso">
      <button class="btn btn-volver" (click)="volver()">← Atrás</button>
      <button class="btn btn-guardar" (click)="guardar()" [disabled]="enviando">
        {{ enviando ? 'Guardando...' : 'Crear Malla Completa' }}
      </button>
    </div>
  </div>
</div>
