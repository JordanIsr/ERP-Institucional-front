<div class="dashboard-container"><section class="bienvenida"><span>{{ rol | titlecase }}</span><h1>Bienvenido, {{ nombre }}</h1><p>{{ mensaje }}</p></section><section class="accesos" *ngIf="accesos.length"><a *ngFor="let acceso of accesos" [routerLink]="acceso.ruta"><i>{{ acceso.icono }}</i><div><h3>{{ acceso.titulo }}</h3><p>{{ acceso.descripcion }}</p></div><b>→</b></a></section><section class="pendiente" *ngIf="rol === 'usuario'"><h3>Cuenta pendiente de autorización</h3><p>No necesitas registrarte nuevamente. Cuando Administración asigne tu rol, cierra sesión y vuelve a ingresar.</p></section></div>
